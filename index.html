<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>25 Anos • Escola Traços & Letras</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
/* Reset básico e tipografia */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    color: white;
}

/* FUNDO */
.hero {
    position: fixed;
    inset: 0;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(25%) contrast(110%) saturate(95%) blur(1px);
    transform: scale(1.05);
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.45));
}

/* FAIXA (CABEÇALHO) */
.band {
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    background: linear-gradient(130deg, #2e2300, #d4af37, #fff3b0, #d4af37, #2e2300);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 50px rgba(212, 175, 55, .7);
    z-index: 10;
}

.band img {
    height: 42px;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, .7));
}

/* PALCO (ÁREA CENTRAL) */
.stage {
    position: absolute;
    top: 70px;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* TÍTULOS */
.gold {
    font-family: 'Playfair Display', serif;
    font-size: 14vw;
    background: linear-gradient(45deg, #FFD700, #fff2aa, #bfa13a);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 215, 0, .5);
    margin-bottom: 10px;
}

.silver {
    font-size: 6vw;
    background: linear-gradient(45deg, #ddd, #fff, #aaa);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 8px;
}

.year {
    color: #ccc;
    letter-spacing: 4px;
    font-size: 3.5vw;
}

/* FRASES (QUOTE BOX) */
.quote {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12%;
    font-family: 'Playfair Display', serif;
    font-size: 5vw;
    color: #ffd966;
    background: rgba(0, 0, 0, .4);
    text-shadow: 0 0 30px rgba(255, 215, 0, .7);
    opacity: 0;
    z-index: 5;
}

/* GALERIA DE FOTOS */
.gallery {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    z-index: 2;
}

.gallery img {
    position: absolute;
    max-width: 85%;
    max-height: 75%;
    border-radius: 18px;
    box-shadow: 0 0 80px rgba(255, 215, 0, .4);
    opacity: 0;
}

/* ESTILO BASE DOS BOTÕES */
button {
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(145deg, #FFD700, #c9a338);
    font-size: 17px;
    font-weight: 600;
    color: #000;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 215, 0, .6);
    z-index: 20;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 30px rgba(255, 215, 0, .8);
}

button:active {
    transform: translateY(0);
    box-shadow: 0 0 25px rgba(255, 215, 0, .6);
}

/* BOTÃO PAUSAR */
#toggle {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
}

/* CONTROLES ANTERIOR/PRÓXIMO */
.controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    z-index: 20;
    /* Alinhamento vertical para o contador */
    align-items: center; 
}

.controls button {
    font-size: 14px;
    padding: 10px 18px;
}

/* Estilo do Contador */
#counter {
    font-size: 16px;
    color: #ffd966;
    text-shadow: 0 0 8px rgba(255, 215, 0, .7);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    width: 65px; /* Para garantir o alinhamento central */
    text-align: center;
}

/* CRÉDITO */
.credit {
    position: fixed;
    bottom: 5px;
    right: 10px;
    font-size: 11px;
    opacity: .5;
    z-index: 20;
}

/* MOBILE */
@media(max-width: 768px) {
    .band {
        height: 55px
    }

    .band img {
        height: 35px
    }

    .stage {
        top: 55px
    }
}
</style>
</head>

<body>

<div class="band">
    <!-- Imagem de Logotipo, use um caminho de imagem válido ou remova se necessário -->
    <img src="img/LOGO.png" alt="Logo Escola Traços & Letras">
</div>

<div class="hero">
    <!-- Imagem de Fundo, use um caminho de imagem válido ou remova se necessário -->
    <img src="img/1.jpg" alt="Fundo de celebração">
</div>

<div class="stage">
    <div class="gold">25 ANOS</div>
    <div class="silver">Escola Traços & Letras</div>
    <div class="year">2000 • 2025</div>
</div>

<div class="quote" id="quote"></div>

<div class="gallery" id="gallery">
    <!-- Use caminhos de imagem válidos ou remova se necessário -->
    <img src="img/1 (1).jpeg" alt="Foto 1 da Galeria">
    <img src="img/1 (10).jpeg" alt="Foto 2 da Galeria">
    <img src="img/1 (2).jpeg" alt="Foto 3 da Galeria">
    <img src="img/1 (4).jpeg" alt="Foto 4 da Galeria">
    <img src="img/1 (3).jpeg" alt="Foto 5 da Galeria">
    <img src="img/1 (5).jpeg" alt="Foto 6 da Galeria">
    <img src="img/1 (6).jpeg" alt="Foto 7 da Galeria">
    <img src="img/1 (7).jpeg" alt="Foto 8 da Galeria">
    <img src="img/1 (8).jpeg" alt="Foto 9 da Galeria">
    <img src="img/1 (9).jpeg" alt="Foto 10 da Galeria">
    <img src="img/11 (1).jpeg">
    <img src="img/11 (2).jpeg">
    <img src="img/11 (3).jpeg">
    <img src="img/11 (4).jpeg">
    <img src="img/20 (1).jpeg">
    <img src="img/20 (2).jpeg">
    <img src="img/20 (3).jpeg">
    <img src="img/20 (4).jpeg">
    <img src="img/20 (5).jpeg">
    <img src="img/20 (6).jpeg">
    <img src="img/20 (7).jpeg">
    <img src="img/20 (8).jpeg">
    <img src="img/20 (9).jpeg">
    <img src="img/20 (10).jpeg">
    <img src="img/20 (11).jpeg">
    <img src="img/20 (12).jpeg">
    <img src="img/20 (13).jpeg">
    <img src="img/20 (14).jpeg">
    <img src="img/20 (15).jpeg">
</div>

<div class="controls">
    <button id="prev">⏮ Anterior</button>
    <!-- Elemento do contador -->
    <span id="counter">1 / 10</span> 
    <button id="next">Próximo ⏭</button>
</div>

<button id="toggle">⏸ Pausar</button>

<div class="credit">Desenvolvido por Nay Cordeiro</div>

<script>
const quotes = [
    "O futuro começa aqui.",
    "Educação transforma destinos.",
    "Cada aluno é uma história.",
    "Aprender é evoluir.",
    "Onde há ensino, há futuro.",
    "Formando mentes, construindo sonhos.",
    "25 anos de educação real."
];

const photos = document.querySelectorAll(".gallery img");
const gallery = document.getElementById("gallery");
const quoteBox = document.getElementById("quote");
const toggle = document.getElementById("toggle");
const next = document.getElementById("next");
const prev = document.getElementById("prev");
// Referência ao contador
const counterElement = document.getElementById("counter");

let playing = true;
let currentPhotoIndex = 0;
const totalPhotos = photos.length;

// Função para atualizar o contador na interface
const updateCounterDisplay = () => {
    // Exibe o índice base 1 / Total
    counterElement.innerText = `${currentPhotoIndex + 1} / ${totalPhotos}`;
};

// Animação de Fundo
gsap.to(".hero img", { scale: 1.2, duration: 40, repeat: -1, yoyo: true, ease: "sine.inOut" });

// Timeline Principal
const tl = gsap.timeline({ repeat: -1, paused: true });

// 1. ANIMAÇÃO INICIAL (Introdução)
tl.from(".gold", { y: 40, opacity: 0, duration: 1.5 });
tl.from(".silver", { opacity: 0, duration: 1 }, "-=1");
tl.from(".year", { opacity: 0, duration: 1 }, "-=1");
tl.to({}, { duration: 3 });
tl.to([".gold", ".silver", ".year"], { opacity: 0, duration: 1 });
tl.to(gallery, { opacity: 1, duration: 1 });

// 2. ANIMAÇÃO DE GALERIA COM LABELS
photos.forEach((img, i) => {
    // Adiciona o label para a foto atual
    tl.addLabel(`photo-${i}`); 
    
    // Atualiza o índice e o contador no início da exibição de cada foto (para o modo automático)
    tl.call(() => {
        currentPhotoIndex = i; // Atualiza o índice para refletir o que está sendo exibido
        updateCounterDisplay(); // Atualiza o display
    }); 
    
    // Animação da foto
    tl.fromTo(img, { opacity: 0, scale: 1.1, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0)", duration: 2 });
    tl.to({}, { duration: 2 }); // Tempo de exibição da foto
    tl.to(img, { opacity: 0, scale: 1.05, filter: "blur(5px)", duration: 1 });

    // Adiciona o label para a citação
    tl.addLabel(`quote-${i}`); 
    
    // Animação da citação
    tl.call(() => { quoteBox.innerText = quotes[i % quotes.length] });
    tl.fromTo(quoteBox, { opacity: 0 }, { opacity: 1, duration: .6 });
    tl.to({}, { duration: 2 }); // Tempo de exibição da citação
    tl.to(quoteBox, { opacity: 0, duration: .6 });
});

// 3. FUNÇÕES DE NAVEGAÇÃO E CONTROLE
const goToPhoto = (index) => {
    // Garante que o índice esteja dentro dos limites (0 até totalPhotos-1) com repetição (loop)
    currentPhotoIndex = (index % totalPhotos + totalPhotos) % totalPhotos;
    
    // Pausa a animação automática
    tl.pause();
    playing = false;
    toggle.innerText = "▶ Continuar";
    
    // Atualiza o contador imediatamente após a navegação manual
    updateCounterDisplay(); 
    
    // Usa tweenTo para uma transição suave até o marcador de tempo da foto
    tl.tweenTo(`photo-${currentPhotoIndex}`, { duration: 1.5, ease: "power2.inOut" });
};

// Toggle Play/Pause
toggle.onclick = () => {
    if (playing) {
        tl.pause();
        toggle.innerText = "▶ Continuar";
    } else {
        tl.play();
        toggle.innerText = "⏸ Pausar";
    }
    playing = !playing;
};

// Botão Próximo
next.onclick = () => {
    goToPhoto(currentPhotoIndex + 1);
};

// Botão Anterior
prev.onclick = () => {
    goToPhoto(currentPhotoIndex - 1);
};

// Inicializa o contador com a primeira foto
updateCounterDisplay();

// Inicia a animação ao carregar
tl.play(); 
</script>

</body>
</html>
