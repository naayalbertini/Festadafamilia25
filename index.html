<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 Anos • Escola Traços & Letras</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* BASE */
body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
}

/* FUNDO */
.hero {
    position: fixed;
    inset: 0;
}
.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(18%) contrast(115%) grayscale(15%);
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
        rgba(0,0,0,.88),
        rgba(0,0,0,.45)
    );
}

/* FAIXA SUPERIOR — PRATA FRIA */
.band {
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    background: linear-gradient(130deg,
        #111,
        #8e8e8e,
        #ededed,
        #8e8e8e,
        #111
    );
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 28px rgba(255,255,255,.22);
    z-index: 10;
}
.band img {
    height: 40px;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.5));
}

/* PALCO */
.stage {
    position: absolute;
    top: 70px;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* TÍTULOS — PRATA REAL */
.gold { /* nome mantido pra não quebrar JS */
    font-family: 'Playfair Display', serif;
    font-size: 13vw;
    background: linear-gradient(45deg,
        #9b9b9b,
        #f5f5f5,
        #bcbcbc
    );
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(255,255,255,.25);
}

.silver {
    font-size: 5.5vw;
    background: linear-gradient(45deg,
        #dedede,
        #aaaaaa
    );
    -webkit-background-clip: text;
    color: transparent;
}

.year {
    margin-top: 10px;
    font-size: 3vw;
    letter-spacing: 4px;
    color: #bfbfbf;
}

/* FRASES */
.quote {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12%;
    font-family: 'Playfair Display', serif;
    font-size: 4.5vw;
    color: #f0f0f0;
    background: rgba(0,0,0,.6);
    text-shadow: 0 0 16px rgba(255,255,255,.3);
    opacity: 0;
    z-index: 5;
}

/* GALERIA */
.gallery {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
}
.gallery img {
    position: absolute;
    max-width: 85%;
    max-height: 75%;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255,255,255,.25);
    opacity: 0;
}

/* BOTÕES — PRATA */
button {
    padding: 12px 30px;
    border-radius: 30px;
    border: none;
    font-weight: 600;
    background: linear-gradient(145deg,
        #eeeeee,
        #9c9c9c
    );
    color: #111;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(255,255,255,.35);
    transition: transform .2s;
}
button:hover { transform: translateY(-2px); }

/* CONTROLES */
.controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    z-index: 20;
}
#counter {
    font-family: 'Playfair Display', serif;
    color: #dedede;
}

/* PAUSE */
#toggle {
    position: fixed;
    bottom: 65px;
    left: 50%;
    transform: translateX(-50%);
}

/* BOTÃO PROGRAMAÇÃO */
.program-btn {
    position: fixed;
    top: 85px;
    right: 18px;
    z-index: 25;
}

/* CRÉDITO */
.credit {
    position: fixed;
    bottom: 6px;
    right: 10px;
    font-size: 11px;
    opacity: .4;
}

/* ===== MOBILE REAL ===== */
@media (max-width: 768px) {

    .band { height: 56px; }
    .band img { height: 32px; }

    .stage {
        top: 56px;
        padding: 0 10px;
    }

    .gold {
        font-size: 20vw;
        line-height: 1.1;
    }

    .silver { font-size: 8vw; }

    .year {
        font-size: 4.5vw;
        letter-spacing: 2px;
    }

    .quote {
        font-size: 6.5vw;
        padding: 18%;
    }

    .gallery img {
        max-width: 92%;
        max-height: 68%;
    }

    button {
        font-size: 14px;
        padding: 10px 22px;
    }

    #toggle { bottom: 72px; }

    .program-btn {
        top: 62px;
        right: 10px;
        padding: 8px 18px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="band">
    <img src="img/LOGO.png" alt="Logo">
</div>

<div class="hero">
    <img src="img/1.jpg" alt="Fundo">
</div>

<a href="programacao.html">
    <button class="program-btn">📅 Programação</button>
</a>

<div class="stage">
    <div class="gold">25 ANOS</div>
    <div class="silver">Escola Traços & Letras</div>
    <div class="year">2000 • 2025</div>
</div>

<div class="quote" id="quote"></div>

<div class="gallery" id="gallery">
    <!-- Use caminhos de imagem válidos ou remova se necessário -->
    <img src="img/1 (1).jpeg" alt="Foto 1 da Galeria">
    <img src="img/1 (10).jpeg" alt="Foto 2 da Galeria">
    <img src="img/1 (2).jpeg" alt="Foto 3 da Galeria">
    <img src="img/1 (4).jpeg" alt="Foto 4 da Galeria">
    <img src="img/1 (3).jpeg" alt="Foto 5 da Galeria">
    <img src="img/1 (5).jpeg" alt="Foto 6 da Galeria">
    <img src="img/1 (6).jpeg" alt="Foto 7 da Galeria">
    <img src="img/1 (7).jpeg" alt="Foto 8 da Galeria">
    <img src="img/1 (8).jpeg" alt="Foto 9 da Galeria">
    <img src="img/1 (9).jpeg" alt="Foto 10 da Galeria">
    <img src="img/11 (1).jpeg">
    <img src="img/11 (2).jpeg">
    <img src="img/11 (3).jpeg">
    <img src="img/11 (4).jpeg">
    <img src="img/20 (1).jpeg">
    <img src="img/20 (2).jpeg">
    <img src="img/20 (3).jpeg">
    <img src="img/20 (4).jpeg">
    <img src="img/20 (5).jpeg">
    <img src="img/20 (6).jpeg">
    <img src="img/20 (7).jpeg">
    <img src="img/20 (8).jpeg">
    <img src="img/20 (9).jpeg">
    <img src="img/20 (10).jpeg">
    <img src="img/20 (11).jpeg">
    <img src="img/20 (12).jpeg">
    <img src="img/20 (13).jpeg">
    <img src="img/20 (14).jpeg">
    <img src="img/20 (15).jpeg">
</div>


<div class="controls">
    <button id="prev">⏮</button>
    <span id="counter">1 / 3</span>
    <button id="next">⏭</button>
</div>

<button id="toggle">⏸</button>

<div class="credit">Desenvolvido por Nay Cordeiro</div>

<script>
const quotes = [
    "O futuro começa aqui.",
    "Educação transforma destinos.",
    "Cada aluno é uma história.",
    "Aprender é evoluir.",
    "Onde há ensino, há futuro.",
    "Formando mentes, construindo sonhos.",
    "25 anos de educação real."
];


const photos = document.querySelectorAll(".gallery img");
const gallery = document.getElementById("gallery");
const quoteBox = document.getElementById("quote");
const toggle = document.getElementById("toggle");
const next = document.getElementById("next");
const prev = document.getElementById("prev");
const counter = document.getElementById("counter");

let current = 0, playing = true;
const total = photos.length;

const updateCounter = () =>
    counter.innerText = `${current + 1} / ${total}`;

const tl = gsap.timeline({ repeat: -1, paused: true });

tl.from(".gold",{opacity:0,y:40,duration:1.5})
  .from(".silver",{opacity:0,duration:1},"-=1")
  .from(".year",{opacity:0,duration:1},"-=1")
  .to({}, {duration:3})
  .to([".gold",".silver",".year"],{opacity:0,duration:1})
  .to(gallery,{opacity:1,duration:1});

photos.forEach((img,i)=>{
    tl.addLabel(`p${i}`);
    tl.call(()=>{ current=i; updateCounter(); });
    tl.fromTo(img,{opacity:0,scale:1.1},{opacity:1,scale:1,duration:2});
    tl.to({}, {duration:2});
    tl.to(img,{opacity:0,scale:1.05,duration:1});

    tl.call(()=> quoteBox.innerText = quotes[i % quotes.length]);
    tl.fromTo(quoteBox,{opacity:0},{opacity:1,duration:.6});
    tl.to({}, {duration:2});
    tl.to(quoteBox,{opacity:0,duration:.6});
});

toggle.onclick = ()=>{
    playing ? tl.pause() : tl.play();
    playing = !playing;
};

next.onclick = ()=> tl.tweenTo(`p${Math.min(current+1,total-1)}`);
prev.onclick = ()=> tl.tweenTo(`p${Math.max(current-1,0)}`);

updateCounter();
tl.play();
</script>

</body>
</html>
